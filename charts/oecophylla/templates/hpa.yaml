{{- if .Values.autoscaling.enabled }}
{{- range $name := .Values.autoscaling.components }}
{{- $component := index $.Values.components $name }}
{{- if $component }}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ include "oecophylla.componentName" (dict "root" $ "name" $name) }}
  labels:
    {{- include "oecophylla.labels" $ | nindent 4 }}
    app.kubernetes.io/component: {{ $name }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ include "oecophylla.componentName" (dict "root" $ "name" $name) }}
  minReplicas: {{ $.Values.autoscaling.minReplicas }}
  maxReplicas: {{ $.Values.autoscaling.maxReplicas }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ $.Values.autoscaling.targetCPUUtilizationPercentage }}
{{- end }}
{{- end }}
{{- end }}

