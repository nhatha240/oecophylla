{{- if .Values.podDisruptionBudget.enabled }}
{{- range $name, $component := .Values.components }}
{{- if and $component.port (gt (int ($component.replicas | default 1)) 1) }}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "oecophylla.componentName" (dict "root" $ "name" $name) }}
  labels:
    {{- include "oecophylla.labels" $ | nindent 4 }}
    app.kubernetes.io/component: {{ $name }}
spec:
  minAvailable: {{ $.Values.podDisruptionBudget.minAvailable }}
  selector:
    matchLabels:
      {{- include "oecophylla.selectorLabels" (dict "root" $ "name" $name) | nindent 6 }}
{{- end }}
{{- end }}
{{- end }}

