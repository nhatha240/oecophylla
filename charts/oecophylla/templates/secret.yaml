{{- if not .Values.secrets.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "oecophylla.fullname" . }}
  labels:
    {{- include "oecophylla.labels" . | nindent 4 }}
type: Opaque
stringData:
  DATABASE_URL: {{ include "oecophylla.databaseUrl" . | quote }}
  REDIS_URL: {{ include "oecophylla.redisUrl" . | quote }}
  JWT_SECRET: {{ .Values.secrets.jwtSecret | quote }}
  POSTGRES_PASSWORD: {{ .Values.secrets.databasePassword | quote }}
  REDIS_PASSWORD: {{ .Values.secrets.redisPassword | quote }}
{{- end }}

