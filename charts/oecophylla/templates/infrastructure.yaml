{{- if .Values.infrastructure.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "oecophylla.fullname" . }}-postgres
  labels:
    {{- include "oecophylla.labels" . | nindent 4 }}
spec:
  clusterIP: None
  selector: { app.kubernetes.io/instance: {{ .Release.Name }}, app.kubernetes.io/component: postgres }
  ports: [{ name: postgres, port: 5432, targetPort: postgres }]
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "oecophylla.fullname" . }}-postgres
  labels:
    {{- include "oecophylla.labels" . | nindent 4 }}
spec:
  serviceName: {{ include "oecophylla.fullname" . }}-postgres
  replicas: 1
  selector:
    matchLabels: { app.kubernetes.io/instance: {{ .Release.Name }}, app.kubernetes.io/component: postgres }
  template:
    metadata:
      labels: { app.kubernetes.io/instance: {{ .Release.Name }}, app.kubernetes.io/component: postgres }
    spec:
      containers:
        - name: postgres
          image: {{ .Values.infrastructure.postgres.image }}
          ports: [{ name: postgres, containerPort: 5432 }]
          env:
            - { name: POSTGRES_DB, value: {{ .Values.database.name | quote }} }
            - { name: POSTGRES_USER, value: {{ .Values.database.user | quote }} }
            - name: POSTGRES_PASSWORD
              valueFrom: { secretKeyRef: { name: {{ include "oecophylla.secretName" . }}, key: POSTGRES_PASSWORD } }
          readinessProbe:
            exec: { command: ["pg_isready", "-U", {{ .Values.database.user | quote }}, "-d", {{ .Values.database.name | quote }}] }
            periodSeconds: 5
          resources:
            {{- toYaml .Values.infrastructure.postgres.resources | nindent 12 }}
          volumeMounts: [{ name: data, mountPath: /var/lib/postgresql }]
  volumeClaimTemplates:
    - metadata: { name: data }
      spec:
        accessModes: [ReadWriteOnce]
        {{- with .Values.infrastructure.storageClass }}
        storageClassName: {{ . }}
        {{- end }}
        resources: { requests: { storage: {{ .Values.infrastructure.postgres.storage }} } }
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "oecophylla.fullname" . }}-redis
  labels:
    {{- include "oecophylla.labels" . | nindent 4 }}
spec:
  clusterIP: None
  selector: { app.kubernetes.io/instance: {{ .Release.Name }}, app.kubernetes.io/component: redis }
  ports: [{ name: redis, port: 6379, targetPort: redis }]
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "oecophylla.fullname" . }}-redis
  labels:
    {{- include "oecophylla.labels" . | nindent 4 }}
spec:
  serviceName: {{ include "oecophylla.fullname" . }}-redis
  replicas: 1
  selector:
    matchLabels: { app.kubernetes.io/instance: {{ .Release.Name }}, app.kubernetes.io/component: redis }
  template:
    metadata:
      labels: { app.kubernetes.io/instance: {{ .Release.Name }}, app.kubernetes.io/component: redis }
    spec:
      containers:
        - name: redis
          image: {{ .Values.infrastructure.redis.image }}
          command: ["/bin/sh", "-ec"]
          args: ['exec redis-server --appendonly yes --requirepass "$REDIS_PASSWORD"']
          env:
            - name: REDIS_PASSWORD
              valueFrom: { secretKeyRef: { name: {{ include "oecophylla.secretName" . }}, key: REDIS_PASSWORD } }
          ports: [{ name: redis, containerPort: 6379 }]
          readinessProbe:
            exec: { command: ["/bin/sh", "-ec", 'redis-cli -a "$REDIS_PASSWORD" ping'] }
            periodSeconds: 5
          resources:
            {{- toYaml .Values.infrastructure.redis.resources | nindent 12 }}
          volumeMounts: [{ name: data, mountPath: /data }]
  volumeClaimTemplates:
    - metadata: { name: data }
      spec:
        accessModes: [ReadWriteOnce]
        {{- with .Values.infrastructure.storageClass }}
        storageClassName: {{ . }}
        {{- end }}
        resources: { requests: { storage: {{ .Values.infrastructure.redis.storage }} } }
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "oecophylla.fullname" . }}-kafka
  labels:
    {{- include "oecophylla.labels" . | nindent 4 }}
spec:
  clusterIP: None
  # KRaft clients must be able to resolve the broker while its readiness probe
  # is still converging; otherwise a headless Service creates a DNS deadlock.
  publishNotReadyAddresses: true
  selector: { app.kubernetes.io/instance: {{ .Release.Name }}, app.kubernetes.io/component: kafka }
  ports:
    - { name: kafka, port: 9092, targetPort: kafka }
    - { name: controller, port: 9093, targetPort: controller }
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "oecophylla.fullname" . }}-kafka
  labels:
    {{- include "oecophylla.labels" . | nindent 4 }}
spec:
  serviceName: {{ include "oecophylla.fullname" . }}-kafka
  replicas: 1
  selector:
    matchLabels: { app.kubernetes.io/instance: {{ .Release.Name }}, app.kubernetes.io/component: kafka }
  template:
    metadata:
      labels: { app.kubernetes.io/instance: {{ .Release.Name }}, app.kubernetes.io/component: kafka }
    spec:
      containers:
        - name: kafka
          image: {{ .Values.infrastructure.kafka.image }}
          ports:
            - { name: kafka, containerPort: 9092 }
            - { name: controller, containerPort: 9093 }
          env:
            - { name: KAFKA_NODE_ID, value: "1" }
            - { name: KAFKA_PROCESS_ROLES, value: "broker,controller" }
            - { name: KAFKA_LISTENERS, value: "PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093" }
            - { name: KAFKA_ADVERTISED_LISTENERS, value: "PLAINTEXT://{{ include "oecophylla.fullname" . }}-kafka:9092" }
            - { name: KAFKA_CONTROLLER_LISTENER_NAMES, value: "CONTROLLER" }
            - { name: KAFKA_INTER_BROKER_LISTENER_NAME, value: "PLAINTEXT" }
            - { name: KAFKA_LISTENER_SECURITY_PROTOCOL_MAP, value: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT" }
            - { name: KAFKA_CONTROLLER_QUORUM_VOTERS, value: "1@localhost:9093" }
            - { name: CLUSTER_ID, value: {{ .Values.infrastructure.kafka.clusterId | quote }} }
            - { name: KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR, value: "1" }
            - { name: KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR, value: "1" }
            - { name: KAFKA_TRANSACTION_STATE_LOG_MIN_ISR, value: "1" }
            - { name: KAFKA_AUTO_CREATE_TOPICS_ENABLE, value: "false" }
            - { name: KAFKA_LOG_DIRS, value: "/var/lib/kafka/data" }
          readinessProbe:
            exec: { command: ["/opt/kafka/bin/kafka-broker-api-versions.sh", "--bootstrap-server", "localhost:9092"] }
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 10
            failureThreshold: 6
          resources:
            {{- toYaml .Values.infrastructure.kafka.resources | nindent 12 }}
          volumeMounts: [{ name: data, mountPath: /var/lib/kafka/data }]
  volumeClaimTemplates:
    - metadata: { name: data }
      spec:
        accessModes: [ReadWriteOnce]
        {{- with .Values.infrastructure.storageClass }}
        storageClassName: {{ . }}
        {{- end }}
        resources: { requests: { storage: {{ .Values.infrastructure.kafka.storage }} } }
{{- end }}
