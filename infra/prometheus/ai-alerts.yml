groups:
  - name: ai-telemetry
    rules:
      - alert: FeedImpressionPersistenceFailures
        expr: sum(rate(feed_impression_persist_failures_total[5m])) > 0.1
        for: 10m
        labels:
          severity: critical
        annotations:
          summary: Feed impression persistence is failing
          description: More than 0.1 feed impression writes per second have failed for 10 minutes.

      - alert: RecommendationModelFallbackSpike
        expr: sum(rate(recommendation_model_fallback_total[5m])) > 0.05
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: Recommendation model fallbacks are elevated
          description: ML load or prediction failures are forcing heuristic fallback.

      - alert: BehaviorEventRejectSpike
        expr: >-
          sum(rate(behavior_events_rejected_total[5m]))
          /
          clamp_min(sum(rate(behavior_events_accepted_total[5m])) + sum(rate(behavior_events_rejected_total[5m])), 0.001)
          > 0.10
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: Behavior event rejection ratio is elevated
          description: More than 10 percent of behavior-event ingest attempts are being rejected.

      - alert: BehaviorEventIngestLagHigh
        expr: >-
          histogram_quantile(0.95,
          sum by (le) (rate(behavior_event_ingest_lag_seconds_bucket[10m]))) > 300
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: Behavior event ingest lag is high
          description: The p95 event ingest lag has exceeded five minutes for 15 minutes.
