name: oecophylla

x-restart: &restart
  restart: unless-stopped

x-rust-build: &rust-build
  context: ./backend
  dockerfile: Dockerfile
  args:
    CARGO_DEPS_JOBS: ${CARGO_DEPS_JOBS:-8}
    CARGO_SERVICE_JOBS: ${CARGO_SERVICE_JOBS:-4}

services:
  postgres:
    <<: *restart
    image: postgres:18-trixie
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  redis:
    <<: *restart
    image: redis:8-trixie
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  kafka:
    <<: *restart
    image: apache/kafka:4.0.0
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      CLUSTER_ID: ${KAFKA_CLUSTER_ID}
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD", "/opt/kafka/bin/kafka-broker-api-versions.sh", "--bootstrap-server", "localhost:9092"]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 30s

  init-topics:
    image: apache/kafka:4.0.0
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic oecophylla.content.created   --partitions 1 --replication-factor 1 && \
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic oecophylla.user.followed    --partitions 1 --replication-factor 1 && \
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic oecophylla.interactions     --partitions 1 --replication-factor 1 && \
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic oecophylla.moderation.action --partitions 1 --replication-factor 1 --config retention.ms=604800000
    restart: "no"

  migrate:
    build:
      context: ./migrations
      dockerfile: Dockerfile
    image: oecophylla-migrate:local
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: ${DATABASE_URL}
    command: ["migrate", "run", "--source", "/app/migrations"]
    restart: "no"

  envoy:
    <<: *restart
    image: envoyproxy/envoy:v1.32-latest
    depends_on:
      auth-service:         { condition: service_started }
      user-service:         { condition: service_started }
      content-service:      { condition: service_started }
      interaction-service:  { condition: service_started }
      feed-service:         { condition: service_started }
      moderation-service:   { condition: service_started }
      notification-service: { condition: service_started }
    volumes:
      - ./envoy/envoy.yaml:/etc/envoy/envoy.yaml:ro
    ports:
      - "8080:8080"
      - "9901:9901"
    command: ["/usr/local/bin/envoy", "-c", "/etc/envoy/envoy.yaml", "--log-level", "info"]

  auth-service:
    <<: *restart
    build:
      <<: *rust-build
      target: auth-service
    depends_on:
      postgres:  { condition: service_healthy }
      redis:     { condition: service_healthy }
      kafka:     { condition: service_healthy }
      migrate:   { condition: service_completed_successfully }
    environment: &svc_env
      RUST_LOG: info,sqlx=warn
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      KAFKA_BROKERS: ${KAFKA_BROKERS}
      JWT_SECRET: ${JWT_SECRET}
      JWT_ACCESS_TTL_SECONDS: ${JWT_ACCESS_TTL_SECONDS}
      JWT_REFRESH_TTL_SECONDS: ${JWT_REFRESH_TTL_SECONDS}
      ARGON2_M_COST: ${ARGON2_M_COST}
      ARGON2_T_COST: ${ARGON2_T_COST}
      ARGON2_P_COST: ${ARGON2_P_COST}
      AUTO_PUBLISH: "true"

  user-service:
    <<: *restart
    build:
      <<: *rust-build
      target: user-service
    depends_on:
      postgres:  { condition: service_healthy }
      redis:     { condition: service_healthy }
      kafka:     { condition: service_healthy }
      migrate:   { condition: service_completed_successfully }
    environment:
      <<: *svc_env

  content-service:
    <<: *restart
    build:
      <<: *rust-build
      target: content-service
    depends_on:
      postgres:  { condition: service_healthy }
      redis:     { condition: service_healthy }
      kafka:     { condition: service_healthy }
      migrate:   { condition: service_completed_successfully }
    environment:
      <<: *svc_env
      LEGACY_VIEW_COUNTER_ENABLED: ${LEGACY_VIEW_COUNTER_ENABLED:-false}

  interaction-service:
    <<: *restart
    build:
      <<: *rust-build
      target: interaction-service
    depends_on:
      postgres:  { condition: service_healthy }
      redis:     { condition: service_healthy }
      kafka:     { condition: service_healthy }
      migrate:   { condition: service_completed_successfully }
    environment:
      <<: *svc_env
      BEHAVIOR_EVENTS_ENABLED: ${BEHAVIOR_EVENTS_ENABLED:-true}
      BEHAVIOR_VIEW_COUNTER_ENABLED: ${BEHAVIOR_VIEW_COUNTER_ENABLED:-false}
      POSITIVE_DWELL_MS: ${POSITIVE_DWELL_MS:-10000}

  feed-service:
    <<: *restart
    build:
      <<: *rust-build
      target: feed-service
    depends_on:
      postgres:           { condition: service_healthy }
      redis:              { condition: service_healthy }
      migrate:            { condition: service_completed_successfully }
      recommendation-api: { condition: service_started }
    environment:
      <<: *svc_env
      RECOMMENDATION_SERVICE_URL: http://recommendation-api:8090
      FEED_CACHE_TTL_SECONDS: "600"
      FEED_RECOMMENDATION_TIMEOUT_MS: "500"
      FEED_RESULT_SIZE: "50"
      FEED_CANDIDATE_POOL_SIZE: "300"

  moderation-service:
    <<: *restart
    build:
      <<: *rust-build
      target: moderation-service
    depends_on:
      postgres: { condition: service_healthy }
      redis:    { condition: service_healthy }
      kafka:    { condition: service_healthy }
      migrate:  { condition: service_completed_successfully }
      init-topics: { condition: service_completed_successfully }
    environment:
      <<: *svc_env

  notification-service:
    <<: *restart
    build:
      <<: *rust-build
      target: notification-service
    # Single replica: SSE fan-out state is in-process (Mutex<HashMap<UserId, Sender>>).
    # A notification produced for user U only reaches the replica U is connected to.
    # Phase 4 moves fan-out to Redis pub/sub for horizontal scale.
    deploy:
      replicas: 1
    depends_on:
      postgres: { condition: service_healthy }
      redis:    { condition: service_healthy }
      kafka:    { condition: service_healthy }
      migrate:  { condition: service_completed_successfully }
      init-topics: { condition: service_completed_successfully }
    environment:
      <<: *svc_env

  recommendation-api:
    <<: *restart
    build:
      context: .
      dockerfile: recommendation_api/Dockerfile
    depends_on:
      postgres: { condition: service_healthy }
      redis:    { condition: service_healthy }
      migrate:  { condition: service_completed_successfully }
    environment:
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}

  analytics-service:
    <<: *restart
    build:
      context: ./services/analytics-service
      dockerfile: Dockerfile
    depends_on:
      postgres: { condition: service_healthy }
      redis:    { condition: service_healthy }
      migrate:  { condition: service_completed_successfully }
    environment:
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8091/health', timeout=3)"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  feature-store-worker:
    <<: *restart
    build:
      context: .
      dockerfile: workers/feature_store_worker/Dockerfile
    depends_on:
      postgres: { condition: service_healthy }
      redis:    { condition: service_healthy }
      kafka:    { condition: service_healthy }
      migrate:  { condition: service_completed_successfully }
      init-topics: { condition: service_completed_successfully }
    environment:
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      KAFKA_BROKERS: ${KAFKA_BROKERS}
      METRICS_PORT: 9108

  nlp-worker:
    <<: *restart
    build:
      context: .
      dockerfile: workers/nlp_worker/Dockerfile
    depends_on:
      postgres: { condition: service_healthy }
      kafka:    { condition: service_healthy }
      migrate:  { condition: service_completed_successfully }
      init-topics: { condition: service_completed_successfully }
    environment:
      DATABASE_URL: ${DATABASE_URL}
      KAFKA_BROKERS: ${KAFKA_BROKERS}

  cache-invalidator:
    <<: *restart
    build:
      <<: *rust-build
      target: cache-invalidator
    depends_on:
      redis: { condition: service_healthy }
      kafka: { condition: service_healthy }
      init-topics: { condition: service_completed_successfully }
    environment:
      <<: *svc_env

  frontend:
    <<: *restart
    build:
      context: ./frontend
    depends_on:
      envoy: { condition: service_started }
    environment:
      ORIGIN: ${ORIGIN}
      ENVOY_URL: ${ENVOY_URL}
      PUBLIC_API_BASE: ${PUBLIC_API_BASE}
      PUBLIC_RECOMMENDATION_TELEMETRY_ENABLED: ${PUBLIC_RECOMMENDATION_TELEMETRY_ENABLED:-false}
    ports:
      - "3000:3000"

  prometheus:
    <<: *restart
    image: prom/prometheus:v3.0.0
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"

  grafana:
    <<: *restart
    image: grafana/grafana:11.4.0
    depends_on: [prometheus]
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GF_SECURITY_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "3001:3000"

  scripts:
    profiles: ["tools"]
    build: ./scripts
    depends_on:
      postgres: { condition: service_healthy }
    environment:
      DATABASE_URL: ${DATABASE_URL}

volumes:
  postgres_data:
  redis_data:
  kafka_data:
